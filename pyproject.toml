[project]
name = "india-sam"
version = "0.1.0"
description = "India's economy as a working model: data pipeline, balanced SAM, multiplier engine and ABM."
readme = "SPEC.md"
requires-python = ">=3.14,<3.15"
license = { text = "MIT (code); CC BY 4.0 (model data and docs); source terms per data/registry.yaml" }
dependencies = [
    # dataframes and storage
    "polars>=1.44",
    "pandas>=3.0",
    "pyarrow>=25.0",
    "duckdb>=1.5",
    # numerics and balancing (Phase 2)
    "numpy>=2.5",
    "scipy>=1.18",
    "cvxpy>=1.9",
    "clarabel>=0.11",
    # validation
    "pandera[polars]>=0.33",
    # config and dates
    "pyyaml>=6.0",
    "python-dateutil>=2.9",
    # HTTP (only via pipeline.core.fetch)
    "httpx>=0.28",
    # spreadsheets
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "fastexcel>=0.21",
    "python-calamine>=0.4",
    "pyxlsb>=1.0",
    "odfpy>=1.4",
    # PDF and HTML
    "pdfplumber>=0.11",
    "pypdf>=6.0",
    "lxml>=6.0",
    "beautifulsoup4>=4.13",
    # label matching
    "rapidfuzz>=3.13",
    "truststore>=0.10",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-xdist>=3.8",
    "ruff>=0.13",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not live'"
markers = [
    "live: needs network access (skipped by default; run with -m live)",
    "unit: framework unit tests",
    "schema: schema/contract tests on clean data",
    "quality: ranges, identities, continuity, revisions",
    "hygiene: line endings, determinism, environment",
    "repro: rebuild reproduces the manifest",
    "raw: raw file integrity against pins",
    "sam: Phase 2 SAM framework, blocks, balancing and audit (tests/sam)",
    "export: Phase 3 web data export (tests/export)",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B905"]
