  access:
    method: Monthly Bulletin table PDF on rbidocs
    requires: none
    notes: 'rbidocs.rbi.org.in answers some requests with an F5/TSPD JavaScript challenge page instead of the file, still
      with HTTP 200, so the status code cannot detect a failed download. Re-check 2026-09-29 on a State Finances XLSX: browser
      User-Agent only, or User-Agent + Accept, gave 200 text/html (challenge); User-Agent + Accept + Accept-Language gave
      200 and a valid XLSX; default curl has its TLS connection dropped. No challenge was solved. Phase 1 must check magic
      bytes (PK for XLSX, %PDF for PDF) and fail loudly on HTML. Whether sending ordinary browser headers is acceptable under
      the RBI Disclaimer (''reserves all right to deny or restrict access'') is part of the RBI permission request (SOURCES
      section 5, item 1). robots rules cannot be read: www.rbi.org.in/robots.txt returns 418 ''Unauthorised Access'' and rbidocs
      robots.txt returns the challenge page. Manual browser download is the fallback. Phase 1 refresh 2026-09-29: the same
      full browser header set (User-Agent, Accept, Accept-Language, Sec-Fetch-*) fetched 18 rbidocs files cleanly at 14:39-14:40
      IST, then got the challenge page (HTTP 200, text/html, 5,691 B) on every rbidocs file from ~15:00 IST. Per DECISIONS
      D1-1(b) probing stopped; www.rbi.org.in HTML pages (PublicationsView, press releases, listings) were not challenged.
      Treat rbidocs as intermittent: fetch at <=1 request per 5 s, stop the run on the first challenge, retry on a later day,
      and use the www.rbi.org.in HTML table where one exists.'
