# data/registry.yaml - India Economy Model source registry (Phase 0 reconnaissance; Phase 1 refresh 2026-09-29)
# All facts retrieved/checked on 2026-09-29. Human-readable companion: SOURCES.md.
# verification.status: verified = verifier confirmed; corrected = verifier (or lead) corrected finder values and the
#   corrected values are used; disputed = conflicting evidence, both values kept; unverified = could not be confirmed.
# Status rule (fix pass 2026-09-29): 'verified'/'corrected' only if the source's existence, its latest release and a
#   licence or terms text were all confirmed. If no licence text was read, or the latest release was not identified,
#   the status is 'unverified'. Lesser gaps (release date, lag, attribution clause, coverage end) are listed in the
#   optional list verification.unconfirmed_fields. Entries added in the fix pass stay 'unverified' until an
#   independent verifier checks them.
# access.requires: none | registration | login | api_key | paid | manual_download (site blocks automated clients;
#   owner downloads in a browser). latest_release.date is ISO (YYYY, YYYY-MM or YYYY-MM-DD) or an explicit sentinel
#   'unknown' / 'n/a'; it is the publication date, never a server Last-Modified time (kept separately if useful).
# Optional aliases: other ids used for the same source in data/gap_map.csv (resolve them to this id).
# Monetary units: Rs crore unless stated. Indian number grouping (e.g. 2,61,77,001) is used inside text fields.
schema_version: 1
checked_on: '2026-09-29'
sources:
- id: mospi_nas_2026_publication
  name: National Accounts Statistics 2026 (new base 2022-23), per-statement XLSX
  publisher: National Accounts Division, NSO, MoSPI
  family: mospi_nas
  urls:
    landing: https://mospi.gov.in/publications-reports/innerpage/2861
    data:
    - https://www.mospi.gov.in/uploads/publications_reports/NAS-2026-Statements/1.1.xlsx
    - https://www.mospi.gov.in/uploads/publications_reports/NAS-2026-Statements/1.9.xlsx
    - https://www.mospi.gov.in/uploads/publications_reports/NAS-2026-Statements/1.14.xlsx
    - https://www.mospi.gov.in/api/publications-reports/get-web-chapter-data
    docs:
    - https://www.mospi.gov.in/uploads/latestReleases/latest_release_1788171660220_f2a7f5ed-3ce3-45cc-a5b2-eebc84623a01_Final_Press_Release_on_NAS_2026.pdf
  access:
    method: Bulk download, one XLSX per statement at /uploads/publications_reports/NAS-2026-Statements/<stmt>.xlsx. Landing
      page is a React SPA; file list via public JSON endpoint POST /api/publications-reports/get-web-chapter-data {publication_id:2861}.
      No combined workbook for 2026.
    requires: none
    notes: Plain GET of files returned 200 on 2026-09-29 (lead re-check, no User-Agent). Missing files return 403, not 404.
  formats:
  - xlsx
  license:
    name: MoSPI copyright policy + GSDD 2026 Category A (open access); no GODL-India statement
    url: https://www.mospi.gov.in/uploads/acts_and_policies/acts_and_policies1778231030122_a1a3ee77-e36d-4895-8da5-b294751cbb1a_272304_(1).pdf
    attribution: 'Reproduce accurately, not misleading; source prominently acknowledged (e.g. ''Source: NSO, MoSPI, <publication/table>,
      accessed 2026-09-29''). Third-party material excluded.'
    terms_url: https://www.mospi.gov.in/api/copy-right-policy/get-copy-right-policy-data
    notes: license.url (GSDD 2026 Gazette) defines access categories only ('Category A (open access data)'); the reproduction
      and attribution clause ('may be reproduced, following the revised GSDD 2026 ... the source must be prominently acknowledged')
      is in the MoSPI copyright policy, served by POST to terms_url (JSON; GET returns 403; re-checked 2026-09-29)
  frequency: Annual (plus reprints of PE and quarterly statements)
  latest_release:
    description: 'NAS 2026: 60 statements (FE 2022-23 and 2023-24, FRE 2024-25) + 4 statements (PE 2025-26 and quarterly Q1
      2022-23 to Q4 2025-26); 64 sub-chapters'
    date: '2026-08-31'
  release_lag: About 17 months after end of the latest FRE year (2024-25). NAS 2025 came out 2025-06-26.
  coverage:
    start: 2022-23
    end: 2024-25
    notes: Detail 2022-23 to 2024-25; PE 2025-26 aggregates; no pre-2022-23 years on the new base (back series pending, expected
      by Dec 2026).
  base_year_price_basis: Base 2022-23; current and constant 2022-23 prices; Rs crore. Saving and disposable income current
    prices only. Double deflation for manufacturing and agriculture.
  key_series:
  - id: '1.1'
    description: 'Key aggregates: GVA, product taxes/subsidies, GDP, CFC, PFCE, GFCE, GFCF, CIS, valuables, X, M, discrepancies,
      primary income from RoW, GNI, NNI, current transfers, GNDI, gross saving'
    unit: Rs crore
  - id: '1.5'
    description: Output, IC, GVA, CFC, CE, OS/MI, production taxes by activity; GCF by industry of use
    unit: Rs crore
  - id: '1.6'
    description: GVA by activity (~24 rows)
    unit: Rs crore
  - id: '1.9'
    description: 'Finances for GCF: gross saving by institution (NFC public DE/NDE, private; FC public/private; general govt;
      households: financial saving, liabilities, physical assets, gold/silver) + net capital inflow'
    unit: Rs crore
  - id: '1.11'
    description: GFCF by asset x institutional sector
    unit: Rs crore
  - id: '1.13'
    description: FISIM by using industry
    unit: Rs crore
  - id: '1.14'
    description: 'Institutional key indicators: GVA, gross saving, GCF (excl. valuables), CFC for all 6 sectors; GDI and final
      consumption ONLY for general government and households incl. NPISH'
    unit: Rs crore
  - id: 4.1/4.2
    description: Value added by Centre and each State; COFOG expenditure of general government (no interest-payments row)
    unit: Rs crore
  - id: 5.1/5.2/5.3
    description: PFCE by COICOP 2018; individual consumption; household financial assets and liabilities by instrument
    unit: Rs crore
  - id: 6.1/6.2
    description: Detailed external transactions account (current account shown with services imports NOT CIF-adjusted); constant-price
      external aggregates
    unit: Rs crore
  - id: 7.1-7.4C
    description: 'Output, IC, GVA, net production taxes, CFC, CE, OS/MI (net of CFC) by industry: total, public, private corporate,
      household; GCF/GFCF/CIS/CFC/net capital stock'
    unit: Rs crore
  - id: 8.x
    description: Disaggregated industry statements; 8.15 GG/DE/NDE; 8.17 PE 2025-26; 8.18 quarterly GDP by expenditure
    unit: Rs crore
  sam_blocks:
  - activity output and intermediate totals
  - 'value added: CE, OS/MI, CFC, net production taxes by industry'
  - product taxes/subsidies totals
  - final demand totals (PFCE, GFCE, GFCF, CIS, valuables, X, M)
  - PFCE by COICOP
  - institutional saving and GCF (6 sectors)
  - household financial vs physical saving
  - RoW current/capital/financial account
  - government value added Centre vs States; COFOG
  quirks: '(1) SPA landing page; use JSON API. (2) Missing /uploads/ files return 403. (3) Full sequences of accounts (1.3,
    1.15, Ch 2, 3, 4.0, 5.0, 6.0) NOT published in NAS 2026 or NAS 2025 although Sources & Methods s.30.7 describes them.
    (4) Current-price discrepancy 0 only for Final years (2022-23, 2023-24); 2024-25 FRE -1,07,438 cr; constant 0 / -70,316
    / +36,908. (5) Saving + NCI != GCF even in Final years (implied errors & omissions GCF-(saving+NCI): +5,20,083 / +3,58,634
    / -2,79,181 cr). (6) Household GDI is a residual; HH GDI - PFCE - HH saving = +8,12,857 / +5,71,133 / -1,28,402 cr. (7)
    Mixed income not separated from OS; household sector includes NPISH and quasi-corporates. (8) At least three vintages
    of the new series: 27 Feb 2026, 5 Jun 2026 (PE), 31 Aug 2026 (NAS 2026). Always record vintage. (9) Bilingual Hindi/English
    label columns, merged headers.'
  verification:
    status: corrected
    finder_evidence: 'Chapter API returned 7 chapters for pub 2861; 32 XLSX probed, all 200, Last-Modified 31 Aug 2026. 1.1
      GDP 26177001.4 | 29073286.7 | 31798524.1; Discrepancies 0 | 0 | -107438.0. PR: ''sixty statements based on the updated
      Final Estimates for the financial years 2022-23 and 2023-24, and First Revised Estimates for 2024-25''.'
    verifier_evidence: 'Verifier corrected: 1.14 GDI/FCE only for GG and households; three vintages not two; saving-investment
      and household residual gaps; 6.1 services imports not CIF-adjusted (row 18 CIF adj 2,92,776); 4.2 no interest row; 64
      sub-chapters. Lead re-check 2026-09-29: plain GET of 1.1.xlsx returned 200 (32,407 B) without User-Agent. Fix pass 2026-09-29
      (after independent check): MoSPI SPA routes return HTTP 200 for any path, so the landing was validated through the publications
      API instead: POST /api/publications-reports/get-web-publications-report-list lists id 2861 ''National Accounts Statistics
      2026'' (2026-08-31).'
