# Which (row group, column group) blocks of the SAM may hold non-zero entries.
# Source: docs/phase0/ACCOUNT_STRUCTURE.md s.11 block diagram (rows receive, columns pay).
# Any entry outside these blocks is a validation error. To add a block, file a request in
# docs/phase2/FRAMEWORK_REQUESTS.md citing the gap-map ref that needs it; do not edit this file from a block.
# Each line: [row group, column group, what the diagram says the block holds].
allowed:
  # ACT row: activities sell their output (make/supply matrix, basic prices)
  - [ACT, COM, "V: make/supply at basic prices (P1)"]
  # COM row: uses at purchasers' prices
  - [COM, ACT, "U: intermediate consumption (P2)"]
  - [COM, MRG, "Mg: margin services supplied (C_TRAD, C_TRNS; P3)"]
  - [COM, HH, "U: PFCE (C1, C1a)"]
  - [COM, GOV, "U: GFCE (C2, C2a)"]
  - [COM, ROW, "X: exports (P5)"]
  - [COM, CAP, "I: GFCF and valuables (I1a, I2, I2a)"]
  - [COM, DSTK, "I: change in inventories by commodity (I3)"]
  - [COM, DISC, "D: GDP expenditure discrepancy (D4; 0 in 2023-24)"]
  # MRG row: margins paid by each commodity
  - [MRG, COM, "Mg: margins paid (P4)"]
  # FAC row: value added and factor income from abroad
  - [FAC, ACT, "VA: CE, mixed income, GOS by activity (V1, V2, V1a, V2a)"]
  - [FAC, ROW, "Yf: CE from RoW (V3)"]
  # HH row
  - [HH, FAC, "Yf: CE, mixed income, household GOS"]
  - [HH, HH, "Tr: intra-household transfers (memo only, 0)"]
  - [HH, NFC, "Tr: dividends, interest"]
  - [HH, FC, "Tr: interest, D44, non-life claims"]
  - [HH, GOV, "Tr: pensions, cash benefits, interest"]
  - [HH, ROW, "Tr: remittances"]
  # NFC row
  - [NFC, FAC, "Yf: GOS"]
  - [NFC, HH, "Tr: small"]
  - [NFC, NFC, "Tr: dividends, interest"]
  - [NFC, FC, "Tr: interest, non-life claims"]
  - [NFC, GOV, "Tr: subsidy-like transfers, interest"]
  - [NFC, ROW, "Tr: investment income"]
  # FC row
  - [FC, FAC, "Yf: GOS"]
  - [FC, HH, "Tr: interest, net non-life premiums"]
  - [FC, NFC, "Tr: interest, net non-life premiums"]
  - [FC, FC, "Tr: inter-FC interest"]
  - [FC, GOV, "Tr: interest on G-secs"]
  - [FC, ROW, "Tr: reserve income, interest"]
  # GOV row
  - [GOV, FAC, "Yf: GOS (= CFC)"]
  - [GOV, HH, "Tr: fees, fines, imputed social contributions"]
  - [GOV, NFC, "Tr: PSU dividends"]
  - [GOV, FC, "Tr: RBI surplus (cash basis), PSB dividends"]
  - [GOV, GOV, "Tr: devolution, grants, compensation, loan recovery"]
  - [GOV, TAX, "Tx: tax receipts (subsidies negative)"]
  - [GOV, ROW, "Tr: grants from abroad"]
  # TAX row
  - [TAX, ACT, "Tx: net production taxes (P10)"]
  - [TAX, COM, "Tx: product taxes, import duties, product subsidies (P7a, P8, P9)"]
  - [TAX, HH, "Tx: personal income tax (T_PIT)"]
  - [TAX, NFC, "Tx: corporation tax (T_CIT)"]
  - [TAX, FC, "Tx: corporation tax (T_CIT)"]
  # ROW row
  - [ROW, COM, "M: imports, CIF-adjusted (P6)"]
  - [ROW, FAC, "Yf: CE to RoW (V4)"]
  - [ROW, HH, "Tr: outward remittances, gifts"]
  - [ROW, NFC, "Tr: FDI income incl. reinvested earnings, interest"]
  - [ROW, FC, "Tr: interest, FDI income"]
  - [ROW, GOV, "Tr: interest on external debt, grants"]
  - [ROW, DISC, "D: NAS-BoP CIF reconciliation (D2)"]
  # CAP row
  - [CAP, HH, "S: household saving"]
  - [CAP, NFC, "S: NFC saving"]
  - [CAP, FC, "S: FC saving"]
  - [CAP, GOV, "S: government saving"]
  - [CAP, ROW, "S: RoW saving (= current-account deficit)"]
  - [CAP, CAP, "Tr: capital transfers, capital grants"]
  - [CAP, INST, "F: liabilities incurred"]
  - [CAP, DISC, "D: saving-investment errors and omissions (D3)"]
  # DSTK row
  - [DSTK, CAP, "I: change in inventories by sector (I3a)"]
  # INST row
  - [INST, CAP, "F: financial assets acquired"]
  # DISC row
  - [DISC, HH, "D: household residual (D1)"]
