    prior: 426713.855544
    balanced: 410457.866201
    why: >-
      Explained. C_CNST <- K_GCEN I1a total, 4,26,714 -> 4,10,458 (-16,256, -3.8%; z 0.962; free medium; binding:
      cf.i1a.gfcf.gg (target 12,22,623, balanced 12,22,622, at its lower edge); gfcf.c_cnst (target 54,26,853,
      balanced 54,26,854, at its upper edge)). The GG and FC capital accounts close through their saving priors,
      which balancing moved (K3a: the Centre down, the States up, toward FSF; K2a: banks down, NBFCs up). The GFCF,
      G-sec and loan totals are held (cf.i1a.gfcf.gg, production's gfcf.c_cnst, the cf.k8.* issuance totals), so
