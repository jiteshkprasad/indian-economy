      expenditure 1,07,404 and CSS spending outside State treasuries, both of which point the same way) and the
      issuer-vs-holder G-sec and deposit splits (capital_financial-29). The moves are a few per cent. GRAS (no
      weights, no constraints) gives 4,35,948.
    sources: [cga_finance_accounts_aag, fc16_ulb_cityfinance_dump, mospi_nas_2026_publication, rbi_fsf_fof, rbi_state_finances_study]
