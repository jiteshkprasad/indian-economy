# Balancing explanations for block `closure` (DECISIONS D2-22; item format in docs/phase2/SAM_GUIDE.md s.12 and
# the header of pipeline/sam/explanations.yaml). Rewritten for the balanced run of the Wave C audit fix
# (2026-10-01; docs/phase2/verify/balanced_sam.md BS-1..BS-14): 10 entry items and 0 cell items
# (ref "*"), every figure read from data/sam/2023-24 (balancing_log, balancing_constraints, prior_diagnostics,
# capital_financial's k9_decomposition). Every `why` starts with a verdict:
#   - "Explained": the prior was off for a documented source disagreement and the balanced value moves toward
#     other evidence, or stays inside a declared evidenced band;
#   - "Explained in direction; level unexplained": the account gap that drove the move is documented, but no
#     source supports this entry's balanced level (or the sources disagree);
#   - "Unexplained": the move carries an account gap whose cause is not a documented source disagreement (here:
#     E_NFPU's prior surplus, government-33 / fincorp-37), a finding for Checkpoint B.
# Verdicts in this file: explained 10.
# Mechanism: cross-entropy (free low 0.25, medium 1, high 4, anchored 16) moves all free entries of one cell with
# the same constraint membership by one factor z = balanced / prior, set by the account and constraint
# multipliers, so the low-confidence entries of the accounts with the largest prior gaps move most. GRAS (no
# weights, no constraints) is quoted as a cross-check. Amounts in Rs crore, current prices, FY 2023-24.
explanations:
  - row: K_HH
    col: H_R1
    ref: "K4a"
    component: "total"
    prior: 332439.449587
    balanced: 354374.435373
    why: >-
      Explained (the move; the group profile it keeps is finding BS-8). K_HH <- H_R1 K4a total, 3,32,439 -> 3,54,374
      (21,935, +6.6%; z 1.066; free low; binding: cf.k4.hh_saving (target 58,90,330, balanced 58,90,330, at its
      lower edge)). The prior K4a is each group's current-account residual (closure option A); the ten residuals sum
      to 55,05,784 against NAS 2026 St 1.9 household saving 58,90,330 (Z = -3,84,547; check k4.prior_sum_vs_nas),
      and cf.k4.hh_saving binds at its lower edge. The other blocks' flows delivered households too little income
      (closure institution_gaps), and cross-entropy closed Z mostly by raising households' property income (R8a) and
      cutting their interest payments (R5), which raises every group's saving by 6-8% of its prior. The level by
      group inherits the factor-income keys' shape (D2-19, factors-19): rural groups save more than urban ones, the
      reverse of IFPRI 2022/23; that is an owner decision for Checkpoint B (closure-19, BS-8), not something
      balancing can settle. GRAS (no weights, no constraints) gives 3,42,030.
    sources: [ifpri_nexus_sam_india_2022_23_paper, mospi_nas_2026_publication, mospi_nas_old_base_2011_12]
