      +3.4%; z 1.034; free medium; binding: t1.cgst (target 8,21,269, balanced 8,62,332, at its upper edge)). The
      prior is each government's cash receipt x the uniform TAX-1 accrual factor (taxes-1); balancing moved
      product-tax receipts from the States to the Centre inside the cash bands (t1.* 5%, t2.* 5-15%), driven by the
