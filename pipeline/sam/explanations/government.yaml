  - row: K_GCEN
    col: G_CEN
    ref: "*"
    component: "*"
    prior: -340382.297682
    balanced: -428507.229417
    why: >-
      Explained. Cell K_GCEN <- G_CEN: -3,39,090 -> -4,27,343 (-88,253, -25.9%; 2 entries). Largest moves:
      government K3a saving_neg -87,298 (-25.3%); government K3a saving_pos -827 (-20.2%). The largest mover is
      explained under its entry: The K3a priors split NAS 2026 St 1.9 GG saving (held by gov.k3.gg_saving) by the
      treasury cash bridge (government-2, -25). The prior leaves G_CEN -2,98,948 (short) and G_STA 4,50,426 (long);
      once the Wave C constraints held the published transfer totals (NAS 4.2 COFOG current transfers, R9d, R18, the
      outside-treasury CSS money, the Union's R10 lines), the saving split became the main outlet: the Centre's
      saving went -3,39,090 -> -4,27,343 and the States' 20,705 -> 1,08,959. Independent FSF evidence supports the
      direction: capital_financial's k9_decomposition term nas_vs_fsf is 1,42,584 for the Centre (NAS-based saving
      less GCF above its FSF net lending) and -1,97,779 for the States, so FSF puts the Centre lower and the States
      higher by about those amounts; the balanced split moves part of the way. The saving_pos / saving_neg pair of
      each government moves together (a sign-fragile net written as two entries).
    sources: [cga_finance_accounts_aag, fc16_ulb_cityfinance_dump, mospi_nas_2026_publication, rbi_fsf_fof, rbi_state_finances_study]
