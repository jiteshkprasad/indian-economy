      totals held by k2.*), so balancing moved saving from banks to NBFCs. FSF supports that direction:
      capital_financial's nas_vs_fsf is 3,68,035 for banks (NAS-based saving above FSF net lending) and -1,34,403
      for NBFCs. RBI Trend and Progress business accounts oppose it (banks' saving near 4.6 lakh, NBFCs' near 1.5
      lakh before auxiliaries and captives; fincorp-2). Which source to follow is a Checkpoint B decision.
