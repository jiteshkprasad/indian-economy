# (ref "*"), every figure read from data/sam/2023-24 (balancing_log, balancing_constraints, prior_diagnostics,
# capital_financial's k9_decomposition). Every `why` starts with a verdict:
#   - "Explained": the prior was off for a documented source disagreement and the balanced value moves toward
#     other evidence, or stays inside a declared evidenced band;
#   - "Explained in direction; level unexplained": the account gap that drove the move is documented, but no
#     source supports this entry's balanced level (or the sources disagree);
#   - "Unexplained": the move carries an account gap whose cause is not a documented source disagreement (here:
#     E_NFPU's prior surplus, government-33 / fincorp-37), a finding for Checkpoint B.
# Verdicts in this file: explained 127, level unexplained 32, unexplained 12.
# Mechanism: cross-entropy (free low 0.25, medium 1, high 4, anchored 16) moves all free entries of one cell with
# the same constraint membership by one factor z = balanced / prior, set by the account and constraint
# multipliers, so the low-confidence entries of the accounts with the largest prior gaps move most. GRAS (no
# weights, no constraints) is quoted as a cross-check. Amounts in Rs crore, current prices, FY 2023-24.
