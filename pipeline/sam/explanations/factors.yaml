  - row: H_R4
    col: F_MIXD
    ref: "F2"
    component: "farm"
    prior: 1435871.046195
    balanced: 1445611.100525
    why: >-
      Explained. H_R4 <- F_MIXD F2 farm, 14,35,871 -> 14,45,611 (9,740, +0.7%; z 1.007; free low; binding:
      f2f3.hh_gross_os_mi (target 97,71,431, balanced 97,71,432, at its upper edge)). Not a factor-income source
      disagreement: the total is held by f2f3.hh_gross_os_mi (target 97,71,431, balanced 97,71,432, at its upper
      edge), and the group split is an IFPRI 2022/23 key mapped k = q (D2-19; free, low). The binding K4 constraint
      raises every group's saving (Z -3,84,547) roughly in proportion to its prior, so the groups whose priors save
      most need the most extra income and the factor total is re-split among groups by a fraction of a per cent
