# Registered 2023-24 bridges between a flow's time-series value (TS) and its SAM definition (plan s.7 T3).
#
# For check classes C and D the build compares SAM - TS with the bridge:
#   bridge      = sum of the clean series listed under `bridge_series` (2023-24, read from clean data, never
#                 typed in), signed so that TS + bridge is on the SAM's concept;
#   residual    = SAM - TS - bridge;
#   pass        if |residual| <= max(500, 1% of |TS|) (class C) or <= 5 (class D);
#   explained   otherwise, if `explained_residual` is recorded here and the run's residual is within
#               max(20% of it, Rs 500 crore) of it (the SAM_GUIDE s.12 drift rule); the residual is recorded
#               only AFTER a full balancing run, from data/timeseries/top_flows_sam_check.parquet, with the
#               owning block's logged adjustment that causes it named in `why`;
#   unexplained otherwise (the test fails once the balanced SAM exists).
# Numbers are never typed here except `explained_residual`, which is copied from the check output of the run
# it explains (like pipeline/sam/explanations.yaml).
#
# Run explained: the balanced SAM of 2026-10-01 03:00 (data/sam/2023-24/balancing_run.json: NEWTON, direct
# path, status optimal, KKT certificate passed; BALANCING.md "Result: BALANCED"). `timeseries` re-run on it:
# 58 pass, 1 no_check, 10 unexplained before this edit (F14, F15, F16, F24, F27, F28, F29, F30, F34, F48).
# Each of the ten now carries the residual of that run, rounded to Rs 0.01 crore, and a `why` that splits it
# into (a) the prior's concept difference, as logged by the owning block, and (b) the balancing move, as
# logged in pipeline/sam/explanations/<block>.yaml and the block's issues file. The amounts quoted in `why`
# are read from that run (block entries, satellites, balancing_constraints.parquet) and from clean data.
#
# Re-run on the balanced SAM of the Wave C audit fix (2026-10-01, docs/phase2/verify/balanced_sam.md BS-14;
# new constraints on government transfers, PM-KISAN in R10, fincorp and taxes bands): 57 pass, 11 explained,
# 1 no_check, 0 unexplained. F16, F24, F25 and F27 changed and are re-registered from that run (their `why`
# says so). The other seven residuals are unchanged within the drift rule; their texts still quote the 03:00
# run's prior gaps (e.g. G_STA +5,00,750, now +4,49,133 after PM-KISAN moved to R10).
explanations:
- flow_id: F14
  why: >-
    The taxes block books UTGST (MH 0007) in T_CGST (component utgst; CROSS_REVIEW s.3) while the Receipt
    Budget 'Total GST' excludes it: bridge +UTGST. TS + bridge (9,62,704.98) equals the taxes block's cash
    targets t1.cgst 8,21,268.82 + t1.gces 1,41,436.16. The residual is the taxes block's logged adjustments:
    (a) prior +15,369.47, the uniform TAX-1 cash-to-accrual factor 1.015965 (taxes-1); (b) balancing
    +32,765.78, which puts both G_CEN <- T_CGST and G_CEN <- T_GCES exactly on their band ceilings (1.05 x
    cash; both bands bind), so the residual is 5% of 9,62,704.98. The balancer moved product tax from State to
    Union rows to absorb the prior's G_STA +5,00,750 / G_CEN -2,97,655 imbalance (government-27); the taxes
    block logs this as not supported by tax evidence (taxes explanations G_CEN <- T_CGST; finding taxes-26).
  bridge_series:
  - {dataset: union_fiscal_rb_receipts, id: rb.tr.0007.union_territories_goods_and_services_tax_utgst, coef: 1}
  explained_residual: 48135.25
