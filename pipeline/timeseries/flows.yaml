# Top-flows time series: the declarative flow definitions (DESIGN_BRIEF s.8, DECISIONS D2-18).
# Plan: docs/phase2/plans/timeseries.md (its s.8 cross-plan review overrides the body). Code: build.py.
#
# Each flow is defined twice:
#   sam:       a sum of SAM cells for 2023-24 (terms: rows <- cols, gap-map refs, optional component and
#              bop_function filters, coefficient). Rows receive, columns pay. Account tokens: a code
#              (C_FOOD), a group of accounts.yaml (@HH, @COM, ...) or a named set below ($C_goods).
#              optional_refs: refs of the definition that may have no entry (a constraint-only official
#              total such as V1 or R9, or a guard such as R3b); every other listed ref must have entries.
#              exclude_components: components of the listed refs that are not part of the flow (e.g. R14
#              'other_primary_income' in a government-interest flow).
#              excluded_refs: refs that may legitimately sit in the same rows x cols block but are NOT
#              part of the flow; any other ref found there is reported (tests/timeseries T4 guard).
#   segments:  the year-by-year series from clean data. One dataset per segment; a term is a clean
#              series id (with coefficient) or a list of NAS API revision rounds taken in precedence order.
#              base_year: '2011-12' (old NAS base and the series tied to it), '2022-23' (new base) or null
#              (BoP, fiscal and FSF series, not tied to a GDP base, and RBI HBS Table 12 before 2011-12,
#              which splices earlier bases). The build checks that a segment's base_year equals the
#              base_year of every clean record it reads. Segments of one flow never overlap within the same
#              (base_year, variant). variant: published (default) or a labelled alternative measure (never
#              mixed into the main series). Every scalar that names something (codes, datasets, series ids,
#              refs, components) must be a string: quote YAML 1.1 words such as NO, YES, ON, OFF.
#
# Status of a row: official when every term has coefficient +1, every input clean record is official and
# the segment is one dataset (a published value or a pure sum of published lines of one table);
# otherwise derived (sign flips, differences, the back-series current-account derivation, links).
# A segment may downgrade itself with `status: derived`. Nothing is estimated.
#
# check_class (the 2023-24 comparison with the balanced SAM, build.py sam_check):
#   A  official total held by fixed entries or `equal` constraints: |TS - SAM| <= max(tol_abs, the summed
#      anchored allowances of the entries in the definition)
#   B  official control with an estimated conversion inside a band: |TS - SAM| <= max(5, tol_rel x |TS|)
#      (only when TS and the owning control are the same concept)
#   C  cash vs accrual, coverage or a concept difference that clean series can bridge: |TS + bridge - SAM|
#      <= max(500, 1% of |TS|), otherwise an entry in explanations.yaml whose recorded difference still holds
#   D  FSF/BoP with counterparty postings: as C but the threshold is Rs 5 crore
#   none  no 2023-24 value on the SAM's concept (old-base-only memo)
#
# link: allowed -> the build computes the linked_2022_23 variant only if the rules of plan s.2.5 hold in
# the data (both overlap ratios exist, |r22 - r23| <= 0.02, one sign); otherwise {refused: <reason>}.
# The build evaluates the rules for every flow and stores the result (definitions column link_rules); a
# refusal that cites unstable ratios while the rules hold is an error. Ratios are never typed here.

cutoff:
  first_period: "1950-51"
  last_period: "2025-26"          # the latest complete FY (plan s.2.0); FY 2026-27 rows are dropped
  excluded_stages: [BE, RE]        # budget estimates are never used (plan s.2.0)
link_rules:
  max_ratio_gap: 0.02
  overlap_periods: ["2022-23", "2023-24"]
  last_linked_period: "2021-22"

account_sets:
  C_goods: [C_CROP, C_LVST, C_FOFI, C_COAL, C_OILG, C_OMIN, C_FOOD, C_BVTB, C_TXAP, C_WOOD, C_GJOM, C_RPET,
            C_CHEM, C_PHRM, C_NMMN, C_MTLS, C_MACH, C_ELEQ, C_TREQ]
  C_services: [C_CNST, C_UTIL, C_TRAD, C_HOTL, C_TRNS, C_COMM, C_FINS, C_INSR, C_DWEL, C_BSRE, C_ITSV, C_EDUC,
               C_HLTH, C_OSRV, C_PADM]
  E_all: [E_NFPU, E_NFPR, E_RBI, E_BANK, E_NBFC, E_INSP]
  E_fc: [E_RBI, E_BANK, E_NBFC, E_INSP]
  K_fc: [K_RBI, K_BANK, K_NBFC, K_INSP]
  G_all: [G_CEN, G_STA]
  EG_all: [E_NFPU, E_NFPR, E_RBI, E_BANK, E_NBFC, E_INSP, G_CEN, G_STA]
  T_product: [T_CGST, T_SGST, T_GCES, T_UEXC, T_SVAT, T_SEXC, T_OPRT]
  T_product_all: [T_CGST, T_SGST, T_GCES, T_UEXC, T_SVAT, T_SEXC, T_OPRT, T_CUST, T_PSUB]
  F_all: [F_LREG, F_LCAS, F_MIXD, F_GOSC]
  union_taxes: [T_CGST, T_GCES, T_CUST, T_UEXC, T_OPRT, T_PIT, T_CIT]
  gov_interest_to_from_centre: [E_RBI, E_BANK, E_NBFC, E_INSP, E_NFPU, E_NFPR, R_ROW, G_STA]
  gov_interest_to_from_states: [E_RBI, E_BANK, E_NBFC, E_INSP, E_NFPU, E_NFPR, R_ROW, G_CEN]

flows:
# ------------------------------------------------------------------------------------------------
# A. Expenditure and trade
# ------------------------------------------------------------------------------------------------
- id: F01
  name: Private final consumption expenditure (PFCE)
  group: expenditure
  tier: core
  check_class: A
  link: allowed
  sam:
    terms:
    - {rows: ["@COM"], cols: ["@HH"], refs: [C1a, C4a, C4b, C4c, C4d], optional_refs: [C4c]}
    excluded_refs: [C1, T3, T3a]
  segments:
  - {code: NB, dataset: mospi_nas_2026_api_b2011_back, base_year: "2011-12", from: "1950-51", to: "2010-11", terms: [{id: api.pfce.current}]}
  - {code: "NO", dataset: mospi_nas_2026_oldbase_nas2025_s1_1, base_year: "2011-12", from: "2011-12", to: "2023-24", terms: [{id: oldbase_nas2025_s1_1.pfce.current}]}
  - {code: NN, dataset: mospi_nas_2026_s1_1, base_year: "2022-23", from: "2022-23", to: "2024-25", terms: [{id: s1_1.pfce.current}]}
  - {code: NP, dataset: mospi_nas_2026_api_b2022_annual, base_year: "2022-23", from: "2025-26", to: "2025-26", terms: [{id: api.pfce.rev_provisional_estimates.current}]}

- id: F02
  name: Government final consumption expenditure (GFCE)
  group: expenditure
  tier: core
  check_class: A
  link: {refused: "concept change at the new base: free PDS grain (food subsidy as a social transfer in kind) and FCI as non-market are inside GFCE; unstable overlap ratios (plan s.2.5)"}
  sam:
    terms:
    - {rows: ["@COM"], cols: ["$G_all"], refs: [C2a]}
    excluded_refs: [C2]
  segments:
  - {code: NB, dataset: mospi_nas_2026_api_b2011_back, base_year: "2011-12", from: "1950-51", to: "2010-11", terms: [{id: api.gfce.current}]}
  - {code: "NO", dataset: mospi_nas_2026_oldbase_nas2025_s1_1, base_year: "2011-12", from: "2011-12", to: "2023-24", terms: [{id: oldbase_nas2025_s1_1.gfce.current}]}
  - {code: NN, dataset: mospi_nas_2026_s1_1, base_year: "2022-23", from: "2022-23", to: "2024-25", terms: [{id: s1_1.gfce.current}]}
  - {code: NP, dataset: mospi_nas_2026_api_b2022_annual, base_year: "2022-23", from: "2025-26", to: "2025-26", terms: [{id: api.gfce.rev_provisional_estimates.current}]}

- id: F03
  name: Gross fixed capital formation (GFCF, excluding valuables)
  group: expenditure
  tier: core
  check_class: A
  link: allowed
  sam:
    terms:
    - {rows: ["@COM"], cols: ["@CAP"], refs: [I1, I1a], optional_refs: [I1]}
    excluded_refs: [I2, I2a]
  segments:
  - {code: NB, dataset: mospi_nas_2026_api_b2011_back, base_year: "2011-12", from: "1950-51", to: "2010-11", terms: [{id: api.gfcf.current}]}
  - {code: "NO", dataset: mospi_nas_2026_oldbase_nas2025_s1_1, base_year: "2011-12", from: "2011-12", to: "2023-24", terms: [{id: oldbase_nas2025_s1_1.gfcf.current}]}
  - {code: NN, dataset: mospi_nas_2026_s1_1, base_year: "2022-23", from: "2022-23", to: "2024-25", terms: [{id: s1_1.gfcf.current}]}
  - {code: NP, dataset: mospi_nas_2026_api_b2022_annual, base_year: "2022-23", from: "2025-26", to: "2025-26", terms: [{id: api.gfcf.rev_provisional_estimates.current}]}

- id: F04
  name: Valuables (gold and silver ornaments)
  group: expenditure
  tier: core
  check_class: A
  link: {refused: "unstable overlap ratios (plan s.2.5)"}
  sam:
    note: "I2 (NAS 1.9 household) + I2a (unsectored); the D3 financing cell K_HH <- X_DISC is not part of the flow"
    terms:
    - {rows: ["@COM"], cols: [K_HH, X_DISC], refs: [I2, I2a]}
    excluded_refs: [I1, I1a, D4]
  segments:
  - {code: NB, dataset: mospi_nas_2026_api_b2011_back, base_year: "2011-12", from: "1999-00", to: "2010-11", terms: [{id: api.valuables.current}]}
  - {code: "NO", dataset: mospi_nas_2026_oldbase_nas2025_s1_1, base_year: "2011-12", from: "2011-12", to: "2023-24", terms: [{id: oldbase_nas2025_s1_1.valuables.current}]}
  - {code: NN, dataset: mospi_nas_2026_s1_1, base_year: "2022-23", from: "2022-23", to: "2024-25", terms: [{id: s1_1.valuables.current}]}
  - {code: NP, dataset: mospi_nas_2026_api_b2022_annual, base_year: "2022-23", from: "2025-26", to: "2025-26", terms: [{id: api.valuables.rev_provisional_estimates.current}]}

- id: F05
  name: Exports of goods
  group: trade
  tier: core
  check_class: A
  link: allowed
  sam:
    terms:
    - {rows: ["$C_goods"], cols: [R_ROW], refs: [P5]}
    excluded_refs: []
  segments:
  - {code: "NO", dataset: mospi_nas_2026_oldbase_nas2025_s1_1, base_year: "2011-12", from: "2011-12", to: "2023-24", terms: [{id: oldbase_nas2025_s1_1.exports_goods.current}]}
  - {code: NN, dataset: mospi_nas_2026_s1_1, base_year: "2022-23", from: "2022-23", to: "2024-25", terms: [{id: s1_1.exports_goods.current}]}

- id: F06
  name: Exports of services
  group: trade
  tier: core
  check_class: A
  link: allowed
  sam:
    terms:
    - {rows: ["$C_services"], cols: [R_ROW], refs: [P5]}
    excluded_refs: []
  segments:
  - {code: "NO", dataset: mospi_nas_2026_oldbase_nas2025_s1_1, base_year: "2011-12", from: "2011-12", to: "2023-24", terms: [{id: oldbase_nas2025_s1_1.exports_services.current}]}
  - {code: NN, dataset: mospi_nas_2026_s1_1, base_year: "2022-23", from: "2022-23", to: "2024-25", terms: [{id: s1_1.exports_services.current}]}

- id: F07
  name: Imports of goods
  group: trade
  tier: core
  check_class: A
  link: allowed
  sam:
    terms:
    - {rows: [R_ROW], cols: ["$C_goods"], refs: [P6]}
    excluded_refs: []
  segments:
  - {code: "NO", dataset: mospi_nas_2026_oldbase_nas2025_s1_1, base_year: "2011-12", from: "2011-12", to: "2023-24", terms: [{id: oldbase_nas2025_s1_1.imports_goods.current}]}
  - {code: NN, dataset: mospi_nas_2026_s1_1, base_year: "2022-23", from: "2022-23", to: "2024-25", terms: [{id: s1_1.imports_goods.current}]}

- id: F08
  name: Imports of services, CIF-adjusted (SAM concept)
  group: trade
  tier: core
  check_class: A
  link: {refused: "new base only: old-base 1.1 services imports are not CIF-adjusted (a different concept; their history is M06)"}
  sam:
    terms:
    - {rows: [R_ROW], cols: ["$C_services"], refs: [P6]}
    excluded_refs: []
  segments:
  - {code: NN, dataset: mospi_nas_2026_s1_1, base_year: "2022-23", from: "2022-23", to: "2024-25", terms: [{id: s1_1.imports_services.current}]}

# ------------------------------------------------------------------------------------------------
# B. Income
# ------------------------------------------------------------------------------------------------
- id: F09
  name: Compensation of employees (domestic)
  group: income
  tier: core
  check_class: A
  link: {refused: "single overlap year: the old-base sequence of accounts (NAS 2024 edition) ends in 2022-23 and is a different vintage from NAS 2025"}
  sam:
    note: "domestic concept (V1); CE receivable by residents = V1 + V3 - V4 is not this flow"
    terms:
    - {rows: [F_LREG, F_LCAS], cols: ["@ACT"], refs: [V1, V1a], optional_refs: [V1]}
    excluded_refs: []
  segments:
  - {code: NS, dataset: mospi_nas_2026_oldbase_soa_s1_15, base_year: "2011-12", from: "2011-12", to: "2022-23", terms: [{id: oldbase_soa_s1_15.generation_of_income.uses.d1.current}]}
  - {code: NN, dataset: mospi_nas_2026_s7_1, base_year: "2022-23", from: "2022-23", to: "2024-25", terms: [{id: s7_1.total.ce.current}]}

- id: F10
  name: Gross operating surplus and mixed income (incl. CFC)
  group: income
  tier: core
  check_class: A
  link: {refused: "single overlap year (the old-base sequence of accounts ends in 2022-23, NAS 2024 edition)"}
  sam:
    terms:
    - {rows: [F_MIXD, F_GOSC], cols: ["@ACT"], refs: [V2, V2a], optional_refs: [V2]}
    excluded_refs: []
  segments:
  - {code: NS, dataset: mospi_nas_2026_oldbase_soa_s1_15, base_year: "2011-12", from: "2011-12", to: "2022-23", status: derived,
     note: "net operating surplus / mixed income plus total-economy CFC (the old base publishes net only)",
     terms: [{id: oldbase_soa_s1_15.generation_of_income.uses.b2n_b3n.current}, {id: oldbase_soa_s1_15.production.uses.p51c.current}]}
  - {code: NN, dataset: mospi_nas_2026_s7_1, base_year: "2022-23", from: "2022-23", to: "2024-25", status: derived,
     note: "net operating surplus / mixed income plus CFC (NAS 7.1 total)",
     terms: [{id: s7_1.total.os_mi.current}, {id: s7_1.total.cfc.current}]}

- id: F11
  name: Net primary income from the rest of the world
  group: income
  tier: core
  check_class: A
  link: {refused: "sign-changing balancing item"}
  sam:
    note: "CE from RoW + property income from RoW - CE to RoW - property income to RoW (R14 is written net of R14a; R3/R3a/R3b listed in case sovereign external-debt interest is written there)"
    terms:
    - {rows: [F_LREG], cols: [R_ROW], refs: [V3]}
    - {rows: ["$EG_all"], cols: [R_ROW], refs: [R13]}
    - {rows: [R_ROW], cols: [F_LREG], refs: [V4], coef: -1}
    - {rows: [R_ROW], cols: ["$EG_all"], refs: [R14, R14a, R3, R3a, R3b], optional_refs: [R3, R3a, R3b], coef: -1}
    excluded_refs: [R15]
  segments:
  - {code: NB, dataset: mospi_nas_2026_api_b2011_back, base_year: "2011-12", from: "1950-51", to: "2010-11", terms: [{id: api.primary_income_row_net.current}]}
  - {code: "NO", dataset: mospi_nas_2026_oldbase_nas2025_s1_1, base_year: "2011-12", from: "2011-12", to: "2023-24", terms: [{id: oldbase_nas2025_s1_1.primary_income_row_net.current}]}
  - {code: NN, dataset: mospi_nas_2026_s1_1, base_year: "2022-23", from: "2022-23", to: "2024-25", terms: [{id: s1_1.primary_income_row_net.current}]}

# ------------------------------------------------------------------------------------------------
# C. Taxes
# ------------------------------------------------------------------------------------------------
- id: F12
  name: Taxes on products incl. import duties
  group: taxes
  tier: core
  check_class: A
  link: {refused: "unstable overlap ratios (plan s.2.5)"}
  sam:
    terms:
    - {rows: ["$T_product"], cols: ["@COM"], refs: [P7a]}
    - {rows: [T_CUST], cols: ["@COM"], refs: [P8]}
    excluded_refs: [P7]
  segments:
  - {code: "NO", dataset: mospi_nas_2026_oldbase_nas2025_s1_1, base_year: "2011-12", from: "2011-12", to: "2023-24", terms: [{id: oldbase_nas2025_s1_1.taxes_on_products.current}]}
  - {code: NN, dataset: mospi_nas_2026_s1_1, base_year: "2022-23", from: "2022-23", to: "2024-25", terms: [{id: s1_1.taxes_on_products.current}]}

- id: F13
  name: Product subsidies
  group: taxes
  tier: core
  display_sign: -1
  check_class: A
  link: {refused: "concept change at the new base: the old base includes food subsidy, the new base books it in GFCE"}
  sam:
    terms:
    - {rows: [T_PSUB], cols: ["@COM"], refs: [P9]}
    excluded_refs: []
  segments:
  - {code: "NO", dataset: mospi_nas_2026_oldbase_nas2025_s1_1, base_year: "2011-12", from: "2011-12", to: "2023-24", note: "NAS 'Less subsidies' line with the SAM sign (x -1)", terms: [{id: oldbase_nas2025_s1_1.subsidies_on_products.current, coef: -1}]}
  - {code: NN, dataset: mospi_nas_2026_s1_1, base_year: "2022-23", from: "2022-23", to: "2024-25", note: "NAS 'Less subsidies' line with the SAM sign (x -1)", terms: [{id: s1_1.subsidies_on_products.current, coef: -1}]}

- id: F14
  name: GST to the Centre (CGST incl. unsettled IGST, and compensation cess)
  group: taxes
  tier: core
  check_class: C
  link: {refused: "not tied to a GDP base"}
  sam:
    note: "taxes block books UTGST in T_CGST (component utgst): registered bridge"
    terms:
    - {rows: [G_CEN], cols: [T_CGST, T_GCES], refs: [T1a]}
    excluded_refs: [T1]
  segments:
  - {code: RB, dataset: union_fiscal_rb_receipts, base_year: null, from: "2022-23", to: "2024-25",
     note: "Receipt Budget 'Total GST' = MH 0005 CGST + MH 0008 IGST (unsettled residual) + MH 0009 compensation cess; actuals only",
     terms: [{id: rb.tr.0005.central_goods_and_services_tax_cgst}, {id: rb.tr.0008.integrated_goods_and_services_tax_igst}, {id: rb.tr.0009.gst_compensation_cess}]}

- id: F15
  name: SGST to the States
  group: taxes
  tier: core
  check_class: C
  link: {refused: "not tied to a GDP base"}
  sam:
    terms:
    - {rows: [G_STA], cols: [T_SGST], refs: [T2x]}
    excluded_refs: [T2]
  segments:
  - {code: KF, dataset: state_fiscal_fc16_kfi, base_year: null, from: "2017-18", to: "2023-24",
     note: "28 States (FC16 key fiscal indicators, audited); GST began in 2017-18, the published zeros before it are not carried",
     terms: [{id: kfi.a_1_1_2-state_goods_and_service_tax.in.all_states_28}]}

- id: F16
  name: Union excise duties
  group: taxes
  tier: core
  check_class: C
  link: {refused: "not tied to a GDP base"}
  sam:
    terms:
    - {rows: [G_CEN], cols: [T_UEXC], refs: [T1a]}
    excluded_refs: [T1]
  segments:
  - {code: RB, dataset: union_fiscal_rb_receipts, base_year: null, from: "2022-23", to: "2024-25", terms: [{id: rb.tr.total.total_union_excise_duties}]}

- id: F17
  name: Customs duties
  group: taxes
  tier: core
  check_class: C
  link: {refused: "not tied to a GDP base"}
  sam:
    terms:
    - {rows: [G_CEN], cols: [T_CUST], refs: [T1a]}
    excluded_refs: [T1]
  segments:
  - {code: RB, dataset: union_fiscal_rb_receipts, base_year: null, from: "2022-23", to: "2024-25", terms: [{id: rb.tr.total.total_customs}]}

- id: F18
  name: State sales tax / VAT
  group: taxes
  tier: core
  check_class: C
  link: {refused: "not tied to a GDP base"}
  breaks:
  - {period: "2017-18", note: "GST subsumed State VAT except on petroleum and alcohol (5,81,435 in 2016-17 to 3,84,913 in 2017-18): flagged, not adjusted"}
  sam:
    terms:
    - {rows: [G_STA], cols: [T_SVAT], refs: [T2x]}
    excluded_refs: [T2]
  segments:
  - {code: KF, dataset: state_fiscal_fc16_kfi, base_year: null, from: "2011-12", to: "2023-24",
     note: "28 States; concept break in 2017-18 (VAT subsumed into GST except petroleum and alcohol): flagged, not adjusted",
     terms: [{id: kfi.a_1_1_1-taxes_on_sales_trade_etc.in.all_states_28}]}

- id: F19
  name: State excise
  group: taxes
  tier: core
  check_class: C
  link: {refused: "not tied to a GDP base"}
  sam:
    terms:
    - {rows: [G_STA], cols: [T_SEXC], refs: [T2x]}
    excluded_refs: [T2]
  segments:
  - {code: KF, dataset: state_fiscal_fc16_kfi, base_year: null, from: "2011-12", to: "2023-24", note: "28 States", terms: [{id: kfi.a_1_1_3-state_excise.in.all_states_28}]}

- id: F20
  name: Stamps and registration fees
  group: taxes
  tier: core
  check_class: C
  link: {refused: "not tied to a GDP base"}
  sam:
    note: "a production tax (P10a) under the component agreed with taxes (CROSS_REVIEW XR-19)"
    terms:
    - {rows: [G_STA], cols: [T_PROD], refs: [P10a], components: [stamps_registration]}
    excluded_refs: []
  segments:
  - {code: KF, dataset: state_fiscal_fc16_kfi, base_year: null, from: "2011-12", to: "2023-24", note: "28 States", terms: [{id: kfi.a_1_1_5-stamps_and_registration_fees.in.all_states_28}]}

- id: F21
  name: Corporation tax
  group: taxes
  tier: core
  check_class: C
  link: {refused: "not tied to a GDP base"}
  sam:
    terms:
    - {rows: [G_CEN], cols: [T_CIT], refs: [T1a]}
    excluded_refs: [T1]
