      Reviewed (U1, 2026-10-02). T4a corporation tax by paying sector: the corporate prior is split across public
      NFC, private NFC, public FC and private FC by old-base NAS 2022-23 D5 shares (oldbase_soa_s2_1/s2_2/s3_1/s3_2,
