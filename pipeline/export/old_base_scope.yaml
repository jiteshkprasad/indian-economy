# Provenance records whose method applies an old-base (NAS 2024 vintage, 2022-23) sequence-of-accounts
# structure to new-base 2023-24 totals (DECISIONS D2-21; PLAN s.3.4.3). Entries with one of these prov ids get
# flag `old_base_structure` (bit 8): "Estimated with the old-base (2022-23 NAS) structure".
# No transitive walk: a record is listed only when its own method applies the old-base structure.
# Each item records why it is in scope. V2 reviews this list.
