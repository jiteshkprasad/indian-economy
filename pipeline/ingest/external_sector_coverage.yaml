- ref: K8
  dataset: external_sector_external_debt
  series_ids: [debt.inr.gross_external_debt.current]
  period: '2024-03-31'
  extent: partial
  note: Gross external debt end-March 2024 by instrument/borrower (RoW-side liabilities only; FSF is the primary for K8).
