  series_ids: [bpm6.inr.bpm6_3.credit.current, bpm6.inr.bpm6_3.debit.current]
  extent: partial
  note: BoP financial account totals used by the RoW counterparty rule.
- ref: P5
  dataset: external_sector_bop_bpm6_annual
  series_ids: [bpm6.inr.bpm6_1_a_a.credit.current, bpm6.inr.bpm6_1_a_b.credit.current]
