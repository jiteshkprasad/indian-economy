    s4_1.autonomous_institutions.current]
  extent: partial
  note: NVA of Centre, States, local bodies and autonomous institutions (4.1) as the own-output key; COFOG
    FCE by function is in mospi_nas_2026_s4_2 (not split Centre/State).
- ref: C4a
  dataset: mospi_nas_2026_s5_1
  series_ids: [s5_1.gross_rentals_equipment_and_material_for_housing.current]
  extent: partial
  note: PFCE on gross rentals incl. equipment/material for housing (5.1 COICOP 04.1); the imputed-rent
    output is in 8.13 (ownership of dwellings). Split by household group is Phase 2.
- ref: C4b
  dataset: mospi_nas_2026_s1_13
  series_ids: [s1_13.private_final_consumption_expenditure.current]
  extent: partial
  note: FISIM consumed by households (602897, 1.13); insurance service charge PFCE is 5.1 'Insurance'.
- ref: C4b
