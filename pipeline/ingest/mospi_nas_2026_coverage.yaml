# Gap-map coverage declared by the mospi_nas_2026 unit (format: pipeline/core/coverage.py).
# extent: full = this unit's data fill the cell by itself (possibly by pure arithmetic on
# published numbers); partial = part of it; control_total = the total the cell must sum to (the
# cell's detail comes from another unit or from Phase 2 estimation).
# Period is the SAM reference year 2023-24 unless stated. Old-base (2011-12) entries use 2022-23,
# the last year of the NAS 2024 sequences of accounts, and serve as priors only.
unit: mospi_nas_2026
entries:
# ---- final demand ------------------------------------------------------------------------------
- ref: C1
  dataset: mospi_nas_2026_s1_1
  series_ids: [s1_1.pfce.current]
  extent: control_total
  note: PFCE total (16415547 in 2023-24); the commodity split comes from the SUT unit.
- ref: C1
  dataset: mospi_nas_2026_s1_12
  series_ids: [s1_12.private_final_consumption_expenditure_in_domestic_market.current,
    s1_12.final_consumption_expenditure_of_resident_households_in_the.current,
    s1_12.final_consumption_expenditure_of_non_resident_households_in.current]
  extent: control_total
  note: PFCE domestic-market total and the resident/non-resident bridge (1.12); COICOP detail in 5.1.
- ref: C2
  dataset: mospi_nas_2026_s1_1
  series_ids: [s1_1.gfce.current]
  extent: control_total
  note: GFCE total; the commodity split comes from the SUT unit.
- ref: C2
