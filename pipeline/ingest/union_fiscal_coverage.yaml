  series_ids: [nssf.ppf.additions]
  extent: partial
  note: PPF gross accretion and stock.
- ref: S9
  dataset: union_fiscal_fa_provident_funds
  series_ids: [fa14.8009.total.additions, fa14.8009.total.discharges, fa14.8009.01.101.additions,
    fa14.8009.01.101.discharges, fa14.8009.02.total.additions, fa14.8009.03.total.additions,
    fa14.8011.total.additions, fa14.8011.total.discharges, fa14.8014.total.additions, fa14.8014.total.discharges]
  extent: partial
  note: Audited Finance Accounts 2023-24 St 14 - Union State Provident Funds (GPF of civil, defence and railway employees; MH 8009) gross additions 68,989.35 and discharges 63,930.50 crore (= AFS Statement III), CGEGIS and other insurance/pension funds (MH 8011) and Postal Life Insurance (MH 8014); balances at 31 Mar 2023 and 2024 are in the dataset. Additions include interest credited (the interest is also Union expenditure under MH 2049); the split is not printed. States' GPF is state_fiscal's.
- ref: R8a
  dataset: union_fiscal_nsi_collections
  series_ids: [nsi.gross_deposits, nsi.net_collections]
