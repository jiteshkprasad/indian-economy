- ref: S7
  dataset: union_fiscal_pib_gst
  period: '2023-04'
  series_ids: [pib.gst.gross_gst, pib.gst.igst, pib.gst.igst_on_imports, pib.gst.igst_settled_to_cgst,
    pib.gst.igst_settled_to_sgst, pib.gst.cgst_post_settlement, pib.gst.sgst_post_settlement,
    pib.gst_domestic_by_state.grand_total]
