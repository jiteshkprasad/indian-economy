- ref: K7b
  dataset: union_fiscal_nssf
  series_ids: [nssf.net_collection]
  extent: partial
  note: Counterparty (K_GCEN, I_SSAV) of household small-savings flows.
- ref: K9b
  dataset: union_fiscal_fa_receipts
  series_ids: [fa8.0050.00.106]
  extent: partial
  note: Cash leg (87,416.22) of the RBI surplus timing item; the accrued leg is RBI's.
- ref: S7
  dataset: union_fiscal_fa_receipts
  series_ids: [fa8.0008.01.total, fa8.0008.02.101, fa8.0008.02.950, fa8.0008.02.951, fa8.0008.02.953, fa8.0008.02.954,
    fa8.0008.02.956, fa8.0008.02.957, fa8.0008.02.959, fa8.0008.02.960, fa8.0008.02.961, fa8.0008.total]
  extent: partial
